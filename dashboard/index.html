<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0d0d0d">
  <title>Matchplan</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon-180.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main id="app">
    <!-- Views werden von app.js gerendert -->
  </main>

  <nav class="tabbar" role="tablist" aria-label="Bereiche">
    <button class="tab" data-view="heute" role="tab" aria-selected="true">
      <span class="tab-icon" aria-hidden="true">☀️</span>
      <span class="tab-label">Heute</span>
    </button>
    <button class="tab" data-view="checkin" role="tab" aria-selected="false">
      <span class="tab-icon" aria-hidden="true">🎾</span>
      <span class="tab-label">Check-in</span>
    </button>
    <button class="tab" data-view="woche" role="tab" aria-selected="false">
      <span class="tab-icon" aria-hidden="true">📊</span>
      <span class="tab-label">Woche</span>
    </button>
  </nav>

  <script src="config.js"></script>
  <script src="app.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => navigator.serviceWorker.register('sw.js'));
    }
  </script>
</body>
</html>
