# Diese Datei beschreibt Render den Dienst. Wer die Anleitung im README
# Schritt für Schritt durchgeht, muss sie nicht anfassen.
services:
  - type: web
    name: ben
    runtime: node
    # Frankfurt: die App läuft in der EU.
    region: frankfurt
    plan: starter
    rootDir: ben
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /
    envVars:
      # sync: false bedeutet, dass Render den Wert abfragt und verschlüsselt
      # ablegt — er steht nirgends im Repository.
      - key: ANTHROPIC_API_KEY
        sync: false
      # ZUGANGSCODE ist bewusst nicht aufgeführt: ohne ihn ist die App über
      # ihre Adresse offen erreichbar. Wer eine Schwelle möchte, trägt ihn in
      # Render unter "Environment" nach — er darf dann auch im Link stehen
      # (.../#mein-code), siehe ben/README.md.
