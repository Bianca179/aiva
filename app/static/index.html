<!doctype html>
<html lang="ro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AIVA</title>
<style>
  :root {
    --page:           #f9f9f7;
    --surface-1:      #fcfcfb;
    --text-primary:   #0b0b0b;
    --text-secondary: #52514e;
    --text-muted:     #898781;
    --grid:           #e1e0d9;
    --baseline:       #c3c2b7;
    --border:         rgba(11,11,11,0.10);
    --series-1:       #2a78d6;   /* Venituri */
    --series-2:       #1baf7a;   /* Cheltuieli */
    --status-critical:#d03b3b;
    --status-warning: #c98500;   /* dunklere Stufe fuer Text auf hellem Grund */
    --status-good:    #006300;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --page:           #0d0d0d;
      --surface-1:      #1a1a19;
      --text-primary:   #ffffff;
      --text-secondary: #c3c2b7;
      --text-muted:     #898781;
      --grid:           #2c2c2a;
      --baseline:       #383835;
      --border:         rgba(255,255,255,0.10);
      --series-1:       #3987e5;
      --series-2:       #199e70;
      --status-critical:#e66767;
      --status-warning: #fab219;
      --status-good:    #0ca30c;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--page); color: var(--text-primary);
    font: 15px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  header {
    display: flex; align-items: baseline; gap: 12px;
    padding: 20px 24px 4px;
  }
  header h1 { font-size: 20px; margin: 0; }
  header .sub { color: var(--text-secondary); font-size: 13px; }
  header .spacer { flex: 1; }
  .lang-toggle button {
    border: 1px solid var(--border); background: var(--surface-1);
    color: var(--text-secondary); padding: 4px 10px; cursor: pointer; font-size: 13px;
  }
  .lang-toggle button:first-child { border-radius: 6px 0 0 6px; }
  .lang-toggle button:last-child { border-radius: 0 6px 6px 0; }
  .lang-toggle button.active { color: var(--text-primary); font-weight: 600; }
  .demo-badge {
    font-size: 12px; color: var(--text-muted); border: 1px dashed var(--baseline);
    border-radius: 6px; padding: 2px 8px;
  }
  main { padding: 12px 24px 40px; max-width: 1200px; margin: 0 auto; }
  .tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 12px; }
  .tile {
    background: var(--surface-1); border: 1px solid var(--border);
    border-radius: 10px; padding: 14px 16px;
  }
  .tile .label { font-size: 13px; color: var(--text-secondary); }
  .tile .value { font-size: 26px; font-weight: 650; margin-top: 4px; }
  .tile .note { font-size: 12.5px; margin-top: 4px; color: var(--text-muted); }
  .tile .note.critical { color: var(--status-critical); font-weight: 600; }
  .tile .note.warning { color: var(--status-warning); font-weight: 600; }
  .tile .note.good { color: var(--status-good); }
  section.card {
    background: var(--surface-1); border: 1px solid var(--border);
    border-radius: 10px; padding: 16px 18px; margin-top: 16px;
  }
  section.card h2 { font-size: 15px; margin: 0 0 10px; }
  .chart-head { display: flex; align-items: center; gap: 16px; }
  .chart-head .spacer { flex: 1; }
  .legend { display: flex; gap: 14px; font-size: 13px; color: var(--text-secondary); }
  .legend .swatch { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 5px; }
  .table-toggle {
    border: 1px solid var(--border); background: transparent; color: var(--text-secondary);
    border-radius: 6px; padding: 3px 9px; font-size: 12.5px; cursor: pointer;
  }
  svg text { font: 12px system-ui, sans-serif; fill: var(--text-muted); }
  .tooltip {
    position: fixed; pointer-events: none; z-index: 10; display: none;
    background: var(--surface-1); border: 1px solid var(--border); border-radius: 8px;
    padding: 8px 10px; font-size: 13px; box-shadow: 0 4px 14px rgba(0,0,0,.15);
  }
  .tooltip .t-month { font-weight: 600; margin-bottom: 2px; }
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  th { text-align: left; color: var(--text-secondary); font-weight: 600; font-size: 13px; }
  th, td { padding: 7px 8px; border-bottom: 1px solid var(--grid); }
  td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
  tr:last-child td { border-bottom: none; }
  .pill { font-size: 12px; border-radius: 999px; padding: 2px 9px; font-weight: 600; white-space: nowrap; }
  .pill.overdue { color: var(--status-critical); border: 1px solid var(--status-critical); }
  .pill.open { color: var(--text-secondary); border: 1px solid var(--baseline); }
  .hint { color: var(--text-muted); font-size: 13px; }
  /* Chat */
  #chat-log { max-height: 320px; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; padding: 4px 0 10px; }
  .msg { max-width: 82%; padding: 8px 12px; border-radius: 12px; white-space: pre-wrap; }
  .msg.user { align-self: flex-end; background: var(--series-1); color: #fff; }
  .msg.bot { align-self: flex-start; background: var(--page); border: 1px solid var(--border); }
  .chat-row { display: flex; gap: 8px; }
  .chat-row input {
    flex: 1; background: var(--page); color: var(--text-primary);
    border: 1px solid var(--border); border-radius: 8px; padding: 9px 12px; font-size: 14px;
  }
  .chat-row button {
    background: var(--series-1); color: #fff; border: none; border-radius: 8px;
    padding: 9px 16px; font-size: 14px; cursor: pointer;
  }
  .chat-row button:disabled { opacity: .5; }
</style>
</head>
<body>
<header>
  <h1>AIVA</h1>
  <span class="sub" data-i18n="subtitle"></span>
  <span class="demo-badge" id="demo-badge" hidden data-i18n="demo"></span>
  <span class="spacer"></span>
  <span class="lang-toggle">
    <button id="btn-ro" onclick="setLang('ro')">RO</button>
    <button id="btn-de" onclick="setLang('de')">DE</button>
  </span>
</header>
<main>
  <div class="tiles">
    <div class="tile">
      <div class="label" data-i18n="revenue"></div>
      <div class="value" id="kpi-revenue">–</div>
      <div class="note" id="kpi-period"></div>
    </div>
    <div class="tile">
      <div class="label" data-i18n="result"></div>
      <div class="value" id="kpi-result">–</div>
      <div class="note" id="kpi-expenses"></div>
    </div>
    <div class="tile">
      <div class="label" data-i18n="openInvoices"></div>
      <div class="value" id="kpi-open">–</div>
      <div class="note critical" id="kpi-overdue"></div>
    </div>
    <div class="tile">
      <div class="label" data-i18n="missingReceipts"></div>
      <div class="value" id="kpi-missing">–</div>
      <div class="note warning" id="kpi-missing-note"></div>
    </div>
  </div>

  <section class="card">
    <div class="chart-head">
      <h2 data-i18n="chartTitle"></h2>
      <span class="spacer"></span>
      <span class="legend">
        <span><span class="swatch" style="background:var(--series-1)"></span><span data-i18n="seriesRevenue"></span></span>
        <span><span class="swatch" style="background:var(--series-2)"></span><span data-i18n="seriesExpenses"></span></span>
      </span>
      <button class="table-toggle" id="table-toggle" onclick="toggleTable()"></button>
    </div>
    <div id="chart"></div>
    <div id="chart-table" hidden></div>
  </section>

  <section class="card">
    <h2 data-i18n="openInvoicesTitle"></h2>
    <div id="invoices"></div>
  </section>

  <section class="card">
    <h2 data-i18n="missingTitle"></h2>
    <p class="hint" data-i18n="missingHint"></p>
    <div id="receipts"></div>
  </section>

  <section class="card">
    <h2 data-i18n="chatTitle"></h2>
    <div id="chat-log"></div>
    <div class="chat-row">
      <input id="chat-input" data-i18n-ph="chatPlaceholder"
             onkeydown="if(event.key==='Enter')sendChat()">
      <button id="chat-send" onclick="sendChat()" data-i18n="chatSend"></button>
    </div>
  </section>
</main>
<div class="tooltip" id="tooltip"></div>

<script>
const I18N = {
  ro: {
    subtitle: "Firma ta, pe scurt", demo: "date demo",
    revenue: "Cifra de afaceri", result: "Rezultat (venituri − cheltuieli)",
    openInvoices: "Facturi neincasate", missingReceipts: "Documente lipsa",
    period: "perioada", expensesLabel: "cheltuieli",
    overdueNote: (n, s) => `⚠ ${n} restante · ${s}`,
    noOverdue: "nicio factura restanta",
    missingNote: n => n > 0 ? "⚠ de trimis pe e-mail" : "totul este complet",
    chartTitle: "Venituri si cheltuieli pe luni", seriesRevenue: "Venituri", seriesExpenses: "Cheltuieli",
    showTable: "Tabel", showChart: "Grafic",
    openInvoicesTitle: "Cine nu a platit inca?",
    colInvoice: "Factura", colClient: "Client", colDue: "Scadenta", colAmount: "Suma", colStatus: "Status",
    statusOverdue: "restanta", statusOpen: "deschisa",
    missingTitle: "Documente lipsa",
    missingHint: "Trimite aceste bonuri/facturi pe adresa de e-mail dedicata - ajung automat in Lexware.",
    colDate: "Data", colDesc: "Descriere", colHint: "Ce lipseste",
    chatTitle: "Intreab-o pe AIVA",
    chatPlaceholder: "De ex.: Cine nu a platit inca? Ce documente lipsesc?",
    chatSend: "Trimite",
    chatError: "A aparut o eroare. Incearca din nou.",
    months: ["ian","feb","mar","apr","mai","iun","iul","aug","sep","oct","nov","dec"],
  },
  de: {
    subtitle: "Dein Unternehmen auf einen Blick", demo: "Demo-Daten",
    revenue: "Umsatz", result: "Ergebnis (Einnahmen − Ausgaben)",
    openInvoices: "Offene Forderungen", missingReceipts: "Fehlende Belege",
    period: "Zeitraum", expensesLabel: "Ausgaben",
    overdueNote: (n, s) => `⚠ ${n} überfällig · ${s}`,
    noOverdue: "keine überfälligen Rechnungen",
    missingNote: n => n > 0 ? "⚠ per E-Mail nachreichen" : "alles vollständig",
    chartTitle: "Einnahmen und Ausgaben pro Monat", seriesRevenue: "Einnahmen", seriesExpenses: "Ausgaben",
    showTable: "Tabelle", showChart: "Diagramm",
    openInvoicesTitle: "Wer hat noch nicht bezahlt?",
    colInvoice: "Rechnung", colClient: "Kunde", colDue: "Fällig am", colAmount: "Betrag", colStatus: "Status",
    statusOverdue: "überfällig", statusOpen: "offen",
    missingTitle: "Fehlende Belege",
    missingHint: "Diese Bons/Rechnungen an die Beleg-E-Mail-Adresse senden – sie landen automatisch in Lexware.",
    colDate: "Datum", colDesc: "Beschreibung", colHint: "Was fehlt",
    chatTitle: "Frag AIVA",
    chatPlaceholder: "Z. B.: Wer hat noch nicht bezahlt? Welche Belege fehlen?",
    chatSend: "Senden",
    chatError: "Es ist ein Fehler aufgetreten. Bitte erneut versuchen.",
    months: ["Jan","Feb","Mär","Apr","Mai","Jun","Jul","Aug","Sep","Okt","Nov","Dez"],
  },
};

let lang = localStorage.getItem("aiva-lang") || "ro";
let DATA = null, INVOICES = [], RECEIPTS = [];
let chatHistory = [];
let tableVisible = false;

const t = key => I18N[lang][key];
const eur = v => new Intl.NumberFormat(lang === "ro" ? "ro-RO" : "de-DE",
  { style: "currency", currency: "EUR" }).format(v);
const monthLabel = m => {
  const [y, mm] = m.split("-");
  return `${t("months")[+mm - 1]} ${y.slice(2)}`;
};

function setLang(l) {
  lang = l;
  localStorage.setItem("aiva-lang", l);
  document.documentElement.lang = l;
  document.getElementById("btn-ro").classList.toggle("active", l === "ro");
  document.getElementById("btn-de").classList.toggle("active", l === "de");
  document.querySelectorAll("[data-i18n]").forEach(el => {
    const v = t(el.dataset.i18n);
    if (typeof v === "string") el.textContent = v;
  });
  document.querySelectorAll("[data-i18n-ph]").forEach(el => el.placeholder = t(el.dataset.i18nPh));
  render();
}

async function load() {
  const [summary, invoices, receipts] = await Promise.all([
    fetch("/api/summary").then(r => r.json()),
    fetch("/api/invoices/open").then(r => r.json()),
    fetch("/api/receipts/missing").then(r => r.json()),
  ]);
  DATA = summary; INVOICES = invoices; RECEIPTS = receipts;
  document.getElementById("demo-badge").hidden = !summary.demoMode;
  setLang(lang);
}

function render() {
  if (!DATA) return;
  document.getElementById("kpi-revenue").textContent = eur(DATA.revenueTotal);
  document.getElementById("kpi-period").textContent =
    DATA.period ? `${t("period")}: ${monthLabel(DATA.period.from)} – ${monthLabel(DATA.period.to)}` : "";
  document.getElementById("kpi-result").textContent = eur(DATA.resultTotal);
  document.getElementById("kpi-expenses").textContent = `${t("expensesLabel")}: ${eur(DATA.expensesTotal)}`;
  document.getElementById("kpi-open").textContent = eur(DATA.openInvoicesTotal);
  const overdueEl = document.getElementById("kpi-overdue");
  if (DATA.overdueCount > 0) {
    overdueEl.textContent = t("overdueNote")(DATA.overdueCount, eur(DATA.overdueTotal));
    overdueEl.className = "note critical";
  } else {
    overdueEl.textContent = t("noOverdue");
    overdueEl.className = "note good";
  }
  document.getElementById("kpi-missing").textContent = DATA.missingReceiptsCount;
  const missNote = document.getElementById("kpi-missing-note");
  missNote.textContent = t("missingNote")(DATA.missingReceiptsCount);
  missNote.className = DATA.missingReceiptsCount > 0 ? "note warning" : "note good";

  document.getElementById("table-toggle").textContent = tableVisible ? t("showChart") : t("showTable");
  renderChart();
  renderChartTable();
  renderInvoices();
  renderReceipts();
}

function renderChart() {
  const el = document.getElementById("chart");
  el.hidden = tableVisible;
  const months = DATA.monthly;
  if (!months.length) { el.innerHTML = ""; return; }
  const W = 940, H = 260, padL = 64, padB = 26, padT = 14;
  const plotW = W - padL - 12, plotH = H - padT - padB;
  const max = Math.max(...months.flatMap(m => [m.revenue, m.expenses]));
  const yMax = Math.ceil(max / 10000) * 10000;
  const groupW = plotW / months.length;
  const barW = Math.min(26, (groupW - 18) / 2);
  const y = v => padT + plotH * (1 - v / yMax);

  let s = `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img">`;
  for (let g = 0; g <= 4; g++) {
    const val = yMax * g / 4, yy = y(val);
    s += `<line x1="${padL}" x2="${W - 12}" y1="${yy}" y2="${yy}" stroke="var(--grid)" stroke-width="1"/>`;
    s += `<text x="${padL - 8}" y="${yy + 4}" text-anchor="end" style="font-variant-numeric:tabular-nums">${(val / 1000)}k</text>`;
  }
  months.forEach((m, i) => {
    const cx = padL + groupW * i + groupW / 2;
    // 2px Luecke zwischen den beiden Balken einer Gruppe
    [["revenue", "--series-1", cx - barW - 1], ["expenses", "--series-2", cx + 1]].forEach(([key, color, x]) => {
      const v = m[key], yy = y(v), h = Math.max(1, padT + plotH - yy);
      const r = Math.min(4, h);
      s += `<path d="M${x},${yy + r} q0,-${r} ${r},-${r} h${barW - 2 * r} q${r},0 ${r},${r} v${h - r} h${-barW} z"
              fill="var(${color})" data-month="${m.month}" data-key="${key}" class="bar"/>`;
    });
    s += `<text x="${cx}" y="${H - 8}" text-anchor="middle">${monthLabel(m.month)}</text>`;
  });
  s += `<line x1="${padL}" x2="${W - 12}" y1="${padT + plotH}" y2="${padT + plotH}" stroke="var(--baseline)" stroke-width="1"/>`;
  s += `</svg>`;
  el.innerHTML = s;

  const tip = document.getElementById("tooltip");
  el.querySelectorAll(".bar").forEach(bar => {
    bar.addEventListener("mousemove", e => {
      const m = DATA.monthly.find(x => x.month === bar.dataset.month);
      tip.style.display = "block";
      tip.style.left = (e.clientX + 14) + "px";
      tip.style.top = (e.clientY - 10) + "px";
      tip.innerHTML = `<div class="t-month">${monthLabel(m.month)}</div>` +
        `<div><span class="swatch" style="background:var(--series-1);display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:5px"></span>${t("seriesRevenue")}: <b>${eur(m.revenue)}</b></div>` +
        `<div><span class="swatch" style="background:var(--series-2);display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:5px"></span>${t("seriesExpenses")}: <b>${eur(m.expenses)}</b></div>`;
    });
    bar.addEventListener("mouseleave", () => tip.style.display = "none");
  });
}

function renderChartTable() {
  const el = document.getElementById("chart-table");
  el.hidden = !tableVisible;
  el.innerHTML = `<table><thead><tr><th></th>
    <th class="num">${t("seriesRevenue")}</th><th class="num">${t("seriesExpenses")}</th></tr></thead><tbody>` +
    DATA.monthly.map(m =>
      `<tr><td>${monthLabel(m.month)}</td><td class="num">${eur(m.revenue)}</td><td class="num">${eur(m.expenses)}</td></tr>`
    ).join("") + `</tbody></table>`;
}

function toggleTable() { tableVisible = !tableVisible; render(); }

function renderInvoices() {
  const rows = INVOICES.map(i => `<tr>
    <td>${i.voucherNumber}</td><td>${i.contactName}</td><td>${i.dueDate}</td>
    <td class="num">${eur(i.openAmount)}</td>
    <td><span class="pill ${i.status}">${i.status === "overdue" ? "⚠ " + t("statusOverdue") : t("statusOpen")}</span></td>
  </tr>`).join("");
  document.getElementById("invoices").innerHTML = `<table><thead><tr>
    <th>${t("colInvoice")}</th><th>${t("colClient")}</th><th>${t("colDue")}</th>
    <th class="num">${t("colAmount")}</th><th>${t("colStatus")}</th>
  </tr></thead><tbody>${rows}</tbody></table>`;
}

function renderReceipts() {
  const rows = RECEIPTS.map(r => `<tr>
    <td>${r.date}</td><td>${r.description}</td><td class="num">${eur(r.amount)}</td><td>${r.hint}</td>
  </tr>`).join("");
  document.getElementById("receipts").innerHTML = `<table><thead><tr>
    <th>${t("colDate")}</th><th>${t("colDesc")}</th><th class="num">${t("colAmount")}</th><th>${t("colHint")}</th>
  </tr></thead><tbody>${rows}</tbody></table>`;
}

async function sendChat() {
  const input = document.getElementById("chat-input");
  const btn = document.getElementById("chat-send");
  const text = input.value.trim();
  if (!text) return;
  input.value = "";
  addMsg(text, "user");
  btn.disabled = true;
  try {
    const resp = await fetch("/api/chat", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ message: text, history: chatHistory }),
    }).then(r => r.json());
    addMsg(resp.reply, "bot");
    chatHistory.push({ role: "user", content: text }, { role: "assistant", content: resp.reply });
  } catch (e) {
    addMsg(t("chatError"), "bot");
  } finally {
    btn.disabled = false;
    input.focus();
  }
}

function addMsg(text, cls) {
  const log = document.getElementById("chat-log");
  const div = document.createElement("div");
  div.className = "msg " + cls;
  div.textContent = text;
  log.appendChild(div);
  log.scrollTop = log.scrollHeight;
}

load();
</script>
</body>
</html>
